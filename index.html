<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speading</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#ece4d4">
<style>
  /*
    Speading — a reading instrument.
    Type stack: a system serif (New York / Charter / Georgia / Iowan)
    set heavy enough to be read at a single glance, on a warm paper ground.
    The focal word is centred on its optical baseline, and one letter — the
    ORP — is marked by a hairline tick beneath it, not by colour. The page
    breathes; controls recede until called.
  */

  :root {
    color-scheme: light;
    --paper:        #ece4d4;
    --paper-deep:   #e3d9c4;
    --paper-edge:   #d8ccb2;
    --ink:          #1b1814;
    --ink-soft:     #6b6357;
    --ink-faint:    #968c7c;
    --rule:         #c8bca0;
    --accent:       #8a2a1f;   /* a marginalia red — used sparingly */
    --serif: "New York", "Iowan Old Style", "Charter", "Sitka Text",
             "Hoefler Text", "Apple Garamond", "EB Garamond", Georgia,
             "Times New Roman", serif;
    --grotesk: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text",
               "Segoe UI", Roboto, system-ui, sans-serif;
    --duration: 90ms;
    /* Apple-grade canonical curves. The first is the deceleration curve used
       throughout iOS / macOS for things that travel: zero acceleration at the
       finish, a long settle. The second is a softer in-out for ambient state
       changes (panel open/close). */
    --ease-out-apple: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-in-out-apple: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-overshoot: cubic-bezier(0.34, 1.36, 0.64, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%;
    /* 100% works on legacy browsers; 100dvh tracks iOS/Android URL-bar
       collapse so the visible viewport always fills exactly. */
    height: 100%;
    height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* A faint grain — woven paper, not a gradient */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(rgba(60,40,20,0.045) 1px, transparent 1px),
      radial-gradient(rgba(40,20,10,0.035) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: multiply;
    z-index: 1;
  }
  /* A vignette of warmer ink at the corners */
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center,
        transparent 55%,
        rgba(80,55,30,0.12) 100%);
    z-index: 1;
  }

  /* ---------- Stage ---------- */

  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 2;
    /* Pointer Events claim every gesture: pinch, wheel, drag-scrub. The
       browser's native page-level scroll/zoom on the stage is in the way. */
    touch-action: none;
    overscroll-behavior: contain;
  }
  body.scrubbing #stage { cursor: grabbing; }
  body:not(.reading):not(.empty):not(.loading) #stage { cursor: grab; }

  /* The reticle — a single horizontal hairline marking the optical
     baseline. The eye lands on it; the word sits on it. */
  #stage::before {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: clamp(180px, 36vw, 520px);
    height: 1px;
    background: var(--rule);
    transform: translate(-50%, calc(0.42em + 22px));
    font-size: clamp(48px, 12vw, 168px);
    opacity: 0.55;
    transition: opacity 400ms ease;
    pointer-events: none;
  }
  body.empty #stage::before { opacity: 0; }
  body.reading #stage::before { opacity: 0.35; }

  #word {
    font-family: var(--serif);
    font-size: clamp(48px, 12vw, 168px);
    font-weight: 400;
    letter-spacing: -0.012em;
    line-height: 1;
    text-align: center;
    padding: 0 24px;
    max-width: 96vw;
    overflow-wrap: break-word;
    color: var(--ink);
    /* Softly crossfaded by JS: opacity bumps down then back up */
    transition: opacity var(--duration) cubic-bezier(.4,0,.2,1);
    will-change: opacity;
    font-feature-settings: "kern" 1, "liga" 1, "calt" 1, "onum" 1;
  }
  /* The empty-state message uses a smaller, italic voice. */
  body.empty #word {
    font-size: clamp(20px, 3.4vw, 30px);
    font-style: italic;
    font-weight: 400;
    color: var(--ink-soft);
    letter-spacing: 0.003em;
    line-height: 1.45;
    max-width: 32ch;
  }
  body.loading #word {
    font-size: clamp(16px, 2.4vw, 22px);
    font-style: italic;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    text-transform: lowercase;
  }

  /* ORP — Optimal Recognition Point.
     A hairline tick under one letter. No colour, no red. Just typography. */
  #word .orp {
    position: relative;
    display: inline-block;
  }
  #word .orp::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -0.18em;
    width: 0.08em;
    height: 0.05em;
    background: var(--accent);
    transform: translateX(-50%);
    border-radius: 1px;
  }

  /* ---------- Folio (top metadata strip) ---------- */

  #folio {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    left: max(20px, env(safe-area-inset-left));
    right: max(20px, env(safe-area-inset-right));
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px;
    z-index: 3;
    pointer-events: none;
    font-family: var(--grotesk);
  }
  #brand {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }
  #brand::after {
    content: "";
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    margin-left: 6px;
    vertical-align: middle;
    transform: translateY(-2px);
    opacity: 0.85;
  }
  #status {
    font-family: var(--grotesk);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  #hint {
    position: fixed;
    bottom: calc(180px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--ink-faint);
    pointer-events: none;
    padding: 0 24px;
    z-index: 3;
    transition: opacity 400ms ease;
  }
  body.reading #hint { opacity: 0; }

  /* ---------- Toast ---------- */

  #toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, calc(-50% - 14vh));
    background: var(--paper-deep);
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 2px;
    font-family: var(--grotesk);
    font-size: 12px;
    letter-spacing: 0.06em;
    opacity: 0;
    transition: opacity 280ms ease, transform 280ms ease;
    pointer-events: none;
    z-index: 20;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 12px 30px -10px rgba(60,30,10,0.15);
    font-variant-numeric: tabular-nums;
  }
  #toast.show { opacity: 1; transform: translate(-50%, calc(-50% - 16vh)); }

  /* ---------- Progress (a hairline in the margin) ---------- */

  #progress {
    position: fixed;
    left: max(20px, env(safe-area-inset-left));
    right: max(20px, env(safe-area-inset-right));
    bottom: calc(154px + env(safe-area-inset-bottom));
    height: 1px;
    background: var(--rule);
    z-index: 4;
    opacity: 0.45;
  }
  #progressBar {
    height: 100%;
    background: var(--ink);
    width: 0;
    transition: width 90ms linear;
  }

  /* ---------- Controls (the colophon) ---------- */

  #controls {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 18px max(20px, env(safe-area-inset-left))
             max(18px, env(safe-area-inset-bottom))
             max(20px, env(safe-area-inset-right));
    display: flex; flex-direction: column; gap: 14px;
    font-family: var(--grotesk);
    font-size: 13px;
    color: var(--ink-soft);
    z-index: 5;
    background: linear-gradient(to top,
      var(--paper) 30%,
      rgba(236,228,212,0.85) 70%,
      rgba(236,228,212,0));
  }
  #controls .row {
    display: flex; align-items: center; gap: 18px;
    justify-content: center;
  }
  #toolbar {
    border-top: 1px solid var(--rule);
    padding-top: 14px;
  }

  /* Buttons set as small-caps text links, not boxes.
     Touch target preserved via padding. */
  #controls button,
  #fileLabel {
    background: transparent;
    color: var(--ink);
    border: none;
    padding: 12px 6px;
    min-height: 44px;
    min-width: 44px;
    cursor: pointer;
    font: inherit;
    font-family: var(--grotesk);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    transition: color 160ms ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  #controls button::after,
  #fileLabel::after {
    content: "";
    position: absolute;
    left: 6px; right: 6px;
    bottom: 8px;
    height: 1px;
    background: var(--ink);
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 220ms cubic-bezier(.4,0,.2,1);
  }
  #controls button:hover::after,
  #fileLabel:hover::after { transform: scaleX(1); }
  #controls button:active { color: var(--accent); }
  #controls button:disabled {
    color: var(--ink-faint);
    opacity: 0.5;
    cursor: default;
  }
  #controls button:disabled::after { display: none; }

  /* Play button is the keystone — set in serif, not all-caps. */
  #playBtn {
    font-family: var(--serif) !important;
    font-style: italic !important;
    font-size: 17px !important;
    text-transform: none !important;
    letter-spacing: 0.01em !important;
    color: var(--ink) !important;
    padding: 12px 22px !important;
  }
  #playBtn::before {
    content: "";
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 10px;
    transform: translateY(-2px);
    transition: background 200ms ease, transform 200ms ease;
  }
  body.reading #playBtn::before {
    background: var(--ink);
    transform: translateY(-2px) scale(0.6);
  }

  /* The skip controls use serif chevrons, not double-arrows */
  #back10Btn, #fwd10Btn {
    font-family: var(--serif) !important;
    font-style: italic !important;
    font-size: 14px !important;
    text-transform: none !important;
    letter-spacing: 0 !important;
  }

  /* ---------- WPM tempo dial ---------- */

  #wpmRow {
    align-items: center;
    gap: 16px;
  }
  #wpmCaption {
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  #wpm {
    flex: 1;
    max-width: 360px;
    height: 28px;
    accent-color: var(--ink);
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    margin: 0;
  }
  #wpm::-webkit-slider-runnable-track {
    height: 1px;
    background: var(--rule);
    border: none;
  }
  #wpm::-moz-range-track {
    height: 1px;
    background: var(--rule);
    border: none;
  }
  #wpm::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    margin-top: -7px;
    cursor: pointer;
    transition: transform 160ms ease;
  }
  #wpm::-webkit-slider-thumb:active { transform: scale(1.2); background: var(--ink); }
  #wpm::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    cursor: pointer;
  }
  #wpmLabel {
    font-family: var(--grotesk);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    min-width: 78px;
    text-align: right;
    flex-shrink: 0;
  }

  #file { display: none; }

  /* ---------- Drop overlay ---------- */

  #drop {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(236,228,212,0.94);
    z-index: 30;
    pointer-events: none;
  }
  #drop.active { display: flex; }
  #drop::before {
    content: "";
    position: absolute;
    inset: 24px;
    border: 1px solid var(--ink);
  }
  #drop::after {
    content: "";
    position: absolute;
    inset: 32px;
    border: 1px solid var(--ink);
    opacity: 0.3;
  }
  #drop > span {
    position: relative;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(22px, 4vw, 34px);
    color: var(--ink);
    letter-spacing: 0.01em;
  }

  /* ---------- Error ---------- */

  #err {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--accent);
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    max-width: 32ch;
    text-align: center;
    line-height: 1.5;
    display: none;
    z-index: 25;
    padding: 24px;
    background: var(--paper);
    border-top: 1px solid var(--accent);
    border-bottom: 1px solid var(--accent);
  }

  /* ---------- Browse overlay — the filmstrip overview ---------- */
  /*
    Browse is a continuous, pinch-zoomable filmstrip of typeset pages. The
    user scrubs through the book at any zoom level — from a single page
    filling the screen, through a row of thumbnails, all the way out to a
    heatmap of the whole book showing where they've already been. Tap a
    page to enter it; tap a word to jump there.
  */

  #overview {
    position: fixed; inset: 0;
    background: var(--paper);
    color: var(--ink);
    display: none;
    flex-direction: column;
    z-index: 15;
    opacity: 0;
    transform: translate3d(0, 0, 0) scale(0.96);
    transform-origin: 50% 50%;
    transition: opacity 380ms var(--ease-out-apple),
                transform 460ms var(--ease-out-apple);
    will-change: transform, opacity;
  }
  #overview.visible { display: flex; }
  #overview.open { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  #overview::before {
    /* page texture */
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(60,40,20,0.04) 1px, transparent 1px);
    background-size: 4px 4px;
    pointer-events: none;
    mix-blend-mode: multiply;
    z-index: 1;
  }

  #ovHeader {
    position: relative;
    padding: max(16px, env(safe-area-inset-top))
             max(24px, env(safe-area-inset-left))
             10px
             max(24px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--rule);
    font-family: var(--grotesk);
    z-index: 3;
    background: var(--paper);
  }
  #ovTitleRow {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
  }
  #ovTitle {
    font-family: var(--serif);
    font-style: italic;
    font-size: 17px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.005em;
  }
  #ovInfo {
    font-family: var(--grotesk);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    display: inline-flex; align-items: baseline;
  }
  #ovPageNum {
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    width: 4ch;
    padding: 0 2px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
    appearance: textfield;
    cursor: text;
  }
  #ovPageNum:focus {
    outline: none;
    border-bottom-color: var(--accent);
    color: var(--accent);
  }
  #ovPageNum::-webkit-outer-spin-button,
  #ovPageNum::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #ovHeader button {
    background: transparent;
    color: var(--ink);
    border: none;
    padding: 8px 8px;
    min-height: 40px;
    min-width: 40px;
    font-family: var(--grotesk);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    transition: color 160ms ease;
  }
  #ovHeader button::after {
    content: "";
    position: absolute;
    left: 8px; right: 8px;
    bottom: 4px;
    height: 1px;
    background: var(--ink);
    transform: scaleX(0);
    transition: transform 240ms var(--ease-out-apple);
  }
  #ovHeader button:hover::after { transform: scaleX(1); }
  #ovHeader #ovJump {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    text-transform: none;
    letter-spacing: 0.01em;
    color: var(--accent);
  }
  #ovHeader #ovJump::after { background: var(--accent); }

  #ovNav {
    display: flex; align-items: center; gap: 4px;
    flex-wrap: wrap;
  }
  #ovNav .spacer { flex: 1; }
  #ovPage {
    flex: 1 1 100%;
    margin-top: 8px;
    height: 22px;
    accent-color: var(--ink);
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
  }
  #ovPage::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
  #ovPage::-moz-range-track { height: 1px; background: var(--rule); }
  #ovPage::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    margin-top: -6px;
    cursor: pointer;
    transition: transform 200ms var(--ease-out-apple);
  }
  #ovPage::-webkit-slider-thumb:active { transform: scale(1.3); background: var(--ink); }
  #ovPage::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    cursor: pointer;
  }

  /* The body is a horizontally-scrolling filmstrip of pages. Each page is
     a tile sized by the current zoom; large means a single readable page,
     small means thumbnails or even a heatmap. JS virtualizes the contents
     of tiles outside the viewport so the DOM stays light no matter how
     long the book is. */
  #ovBody {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: var(--paper-deep);
    z-index: 2;
    /* Pointer-events drive scroll, pinch and tap; native scroll suppressed. */
    touch-action: none;
    overscroll-behavior: contain;
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
  }
  body.scrubbing #ovBody { cursor: grabbing; }
  /* The strip — a single absolutely-positioned row that we transform
     horizontally with translate3d. Vertical centering via flex.
     The row's width is computed in JS from pageCount × tileWidth. */
  #ovStrip {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  #ovStrip .tile {
    flex: 0 0 auto;
    box-sizing: border-box;
    width: var(--ov-tile-w, 240px);
    height: var(--ov-tile-h, 320px);
    margin-right: var(--ov-gap, 14px);
    background: var(--paper);
    border: 1px solid var(--rule);
    box-shadow: 0 1px 0 rgba(28,24,22,0.04),
                0 12px 28px -14px rgba(60,30,10,0.18);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    color: var(--ink);
    font-family: var(--serif);
    transition: box-shadow 280ms var(--ease-out-apple),
                transform 280ms var(--ease-out-apple);
  }
  #ovStrip .tile:last-child { margin-right: 0; }
  body.ov-heat #ovStrip .tile { box-shadow: none; border: none; border-radius: 1px; }
  #ovStrip .tile.read::after {
    /* Faint marginalia tint to show "you've been here". */
    content: "";
    position: absolute; inset: 0;
    background: rgba(138, 42, 31, 0.05);
    pointer-events: none;
  }
  #ovStrip .tile.current {
    box-shadow: 0 0 0 2px var(--ink),
                0 1px 0 rgba(28,24,22,0.04),
                0 18px 36px -16px rgba(60,30,10,0.28);
    transform: translateY(-2px);
    z-index: 2;
  }
  /* In the deepest zoom-out the tiles collapse to colored bands:
     a heatmap of where you've been. */
  body.ov-heat #ovStrip .tile { background: var(--paper); }
  body.ov-heat #ovStrip .tile.read { background: var(--ink-soft); }
  body.ov-heat #ovStrip .tile.current { background: var(--accent); }
  body.ov-heat #ovStrip .tile .folio { display: none; }

  /* Page contents inside a tile. Only the pages near the viewport get
     populated (virtualization); empty tiles show a folio number only. */
  #ovStrip .tile .pg {
    position: absolute;
    inset: 0;
    padding: 6%;
    overflow: hidden;
    line-height: 1.45;
    text-align: justify;
    text-justify: inter-word;
    hyphens: auto;

  }
  #ovStrip .tile .folio {
    position: absolute;
    bottom: 8px; left: 0; right: 0;
    text-align: center;

  /* ---------- Mobile adjustments ---------- */

  @media (max-width: 560px) {

    #progress { bottom: calc(140px + env(safe-area-inset-bottom)); }

  /* ---------- Settings link in folio ---------- */

    pointer-events: auto;

    border: none;

    font-style: italic;

  #settingsLink::after {

    height: 1px;

  }

  #settingsCard {

  /* ---------- Highway lane (Highway transition mode) ---------- */
  #highwayLane {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;

  }
  body.mode-highway #word { opacity: 0 !important; transition: none; }

  body.empty.mode-highway #highwayLane { display: none; }

  .highway-word {
    position: absolute;
    top: 50%;
    left: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(48px, 9vw, 140px);

  .highway-word .orp { color: var(--accent); position: relative; }
  .highway-word .orp::after {
    content: "";

    left: 50%; bottom: -0.18em;
    width: 0.18em; height: 1px;
    background: var(--accent);
    transform: translateX(-50%);

  @keyframes highway-pass {
    from { transform: translate3d(110vw, -50%, 0); }
    to   { transform: translate3d(-110%, -50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .highway-word { animation: none; transform: translate3d(50%, -50%, 0); left: 50%; }
  }

  /* ---------- Highway: continuous Sentence ribbon ---------- */
  .highway-ribbon {
    position: absolute;
    top: 50%;
    left: 0;
    /* Vertical centering moved to translate3d in JS so the GPU-composited
       layer's transform isn't fighting a non-3d translate(). */
    transform: translate3d(0, -50%, 0);
    white-space: nowrap;
    font-family: var(--serif);
    font-weight: 500;
    font-size: calc(clamp(48px, 9vw, 140px) * var(--word-scale, 1));
    line-height: 1;
    color: var(--ink);
    font-feature-settings: "kern" 1, "liga" 1, "calt" 1, "onum" 1;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    will-change: transform;

       slower devices when reading begins. */
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .highway-ribbon .hw-w { display: inline-block; margin-right: 0.45em; }
  .highway-ribbon .hw-w .orp { color: var(--accent); position: relative; }
  .highway-ribbon .hw-w .orp::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -0.18em;
    width: 0.18em; height: 1px;
    background: var(--accent);
    transform: translateX(-50%);
  }

  /* When sentence ribbon is the active highway style, hide stray .highway-word floats */
  body.style-sentence .highway-word { display: none; }
  body.style-cars .highway-ribbon { display: none; }

  /* ---------- Highway sub-section in settings ---------- */
  #highwaySection { display: none; }
  body.mode-highway #highwaySection { display: block; }
  .settings-section + .settings-section {
    margin-top: 24px;
    padding-top: 24px;

  }
  #highwayStyle {
    display: flex; flex-direction: column; gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }
  .hw-btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    background: var(--paper);
    border: none;
    padding: 14px 18px;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: var(--ink);
    transition: background 160ms ease;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    min-height: 56px;
  }
  .hw-btn:hover { background: rgba(154, 50, 30, 0.04); }
  .hw-btn .mode-name {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 500;
  }
  .hw-btn .mode-desc {
    font-family: var(--serif);
    font-style: italic;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .hw-btn[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
  }
  .hw-btn[aria-pressed="true"] .mode-desc { color: rgba(236, 228, 212, 0.8); }
  .hw-btn[aria-pressed="true"]::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
  }

  /* ---------- Word scale (font-size multiplier) ---------- */
  #word { font-size: calc(clamp(48px, 9vw, 140px) * var(--word-scale, 1)); }
  .highway-word { font-size: calc(clamp(48px, 9vw, 140px) * var(--word-scale, 1)); }

  #scaleRow {
    display: flex; align-items: center; gap: 14px;
  }
  #scaleSlider {
    flex: 1;
    height: 22px;
    accent-color: var(--ink);
    -webkit-appearance: none; appearance: none;
    background: transparent;
  }
  #scaleSlider::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
  #scaleSlider::-moz-range-track { height: 1px; background: var(--rule); }
  #scaleSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    margin-top: -7px;
    cursor: pointer;
  }
  #scaleSlider::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    cursor: pointer;
  }
  #scaleLabel {
    font-family: var(--grotesk);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    min-width: 60px;
    text-align: right;
  }

  /* ---------- Phone landscape: collapse non-essentials so the page is the page ----------
     Detect by short height (any phone in landscape is ~390-490px tall) rather
     than width — iPhone 17 / 17 Pro Max go up to 956px wide in landscape and
     would have escaped the previous max-width: 920px rule. */
  @media (orientation: landscape) and (max-height: 540px) {
    #folio {
      top: max(6px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
    }
    #brand { font-size: 11px; }
    #status { font-size: 10px; }
    #hint { display: none; }
    #controls {
      padding: 4px max(10px, env(safe-area-inset-left)) max(6px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-right));
      gap: 4px;
    }
    #toolbar { gap: 6px; }
    #toolbar button, #fileLabel { padding: 5px 9px; min-height: 34px; font-size: 11.5px; }
    #wpmRow { gap: 10px; padding-top: 2px; }
    #wpmCaption, #wpmLabel { font-size: 10px; }
    #wpm { height: 22px; }
    #progress { bottom: calc(54px + env(safe-area-inset-bottom)); }
    /* Big book, small screen: let the focal word breathe. */
    #word, .highway-ribbon { font-size: calc(clamp(40px, 14vmin, 110px) * var(--word-scale, 1)); }
    body.reading #folio { opacity: 0; transition: opacity 500ms cubic-bezier(0.32,0.72,0,1); pointer-events: none; }
    body.reading #controls { opacity: 0.14; transition: opacity 500ms cubic-bezier(0.32,0.72,0,1); }
    body.reading #controls:hover, body.reading #controls:focus-within { opacity: 1; }
  }
</style>

<script>
  const $ = (id) => document.getElementById(id);

  // ---- WPM control (set up FIRST so it always works, even if later code fails) ----
  const wpmEl = $("wpm"), wpmLabel = $("wpmLabel");
  const WPM_KEY = "speading:wpm";
  try {
    const savedWpm = localStorage.getItem(WPM_KEY);
    if (savedWpm) wpmEl.value = savedWpm;
  } catch {}
  function setWpmLabel() { wpmLabel.textContent = wpmEl.value + " wpm"; }
  function intervalMs() { return 60000 / Math.max(1, parseInt(wpmEl.value, 10)); }
  function onWpmChange() {
    setWpmLabel();
    try { localStorage.setItem(WPM_KEY, wpmEl.value); } catch {}
    if (typeof rescheduleTick === "function") rescheduleTick();
  }
  wpmEl.addEventListener("input", onWpmChange);
  wpmEl.addEventListener("change", onWpmChange);
  setWpmLabel();

  // ---- pdf.js init ----
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  } catch (e) { console.error("pdf.js init failed:", e); }

  const wordEl = $("word");
  const playBtn = $("playBtn"), browseBtn = $("browseBtn"), fileInput = $("file");
  const back10Btn = $("back10Btn"), fwd10Btn = $("fwd10Btn");
  const back10pBtn = $("back10pBtn"), fwd10pBtn = $("fwd10pBtn");
  const statusEl = $("status"), errEl = $("err"), bar = $("progressBar");
  const toastEl = $("toast"), drop = $("drop"), stage = $("stage");
  const overview = $("overview"), ovBody = $("ovBody"), ovTitle = $("ovTitle");
  const ovPage = $("ovPage"), ovInfo = $("ovInfo");
  const ovPageNum = $("ovPageNum"), ovTotal = $("ovTotal");
  const ovPrev = $("ovPrev"), ovNext = $("ovNext"), ovClose = $("ovClose"), ovJump = $("ovJump");
  const settingsLink = $("settingsLink"), settings = $("settings"), settingsClose = $("settingsClose");
  const modePicker = $("modePicker"), highwayLane = $("highwayLane");

  const PAGE_SIZE = 250;
  const STORAGE_PREFIX = "speading:v1:";

  let words = [];
  let idx = 0;
  let playing = false;
  let timer = null;
  let bookKey = null;
  let bookName = "";
  let currentOverviewPage = 0;

  function rescheduleTick() {
    // Tick is only the schedule for non-ribbon modes. In ribbon mode the
    // RAF loop drives idx, and reading WPM changes are picked up live by
    // ribbonPxPerSec(). Without this guard, tick() would fire alongside the
    // RAF loop and yank the ribbon back to the current idx every interval —
    // visually, words flash and vanish as the two loops fight.
    if (typeof isRibbon === "function" && isRibbon()) return;
    if (playing) { clearTimeout(timer); timer = setTimeout(tick, intervalMs()); }
  }

  // ---- Toast ----
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  // ---- Reading state ----
  function pageCount() { return Math.max(1, Math.ceil(words.length / PAGE_SIZE)); }
  function pageOf(i) { return Math.floor(i / PAGE_SIZE); }

  // Compute the optimal recognition point for a word.
  // Roughly: shorter words → first letter; longer words → letter ~⅓ from start.
  function orpIndex(w) {
    const n = w.length;
    if (n <= 1) return 0;
    if (n <= 5) return 1;
    if (n <= 9) return 2;
    if (n <= 13) return 3;
    return 4;
  }

  // Render the focal word with the ORP letter wrapped in a span.
  // Punctuation is skipped when picking the ORP — we want a *letter*.
  function renderFocal(w, target) {
    target = target || wordEl;
    const letters = [...w];
    let start = 0;
    while (start < letters.length && !/\p{L}/u.test(letters[start])) start++;
    if (start === letters.length) {
      target.textContent = w;
      return;
    }
    const tail = letters.slice(start);
    const orp = start + Math.min(orpIndex(tail.join("")), tail.length - 1);

    const before = letters.slice(0, orp).join("");
    const at = letters[orp];
    const after = letters.slice(orp + 1).join("");

    target.innerHTML = "";
    if (before) target.appendChild(document.createTextNode(before));
    const span = document.createElement("span");
    span.className = "orp";
    span.textContent = at;
    target.appendChild(span);
    if (after) target.appendChild(document.createTextNode(after));
  }

  const reducedMotion =
    window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- Word-transition modes ----
  // "flash"   — instant content swap, no transition
  // "fade"    — brief opacity dip, swap, fade back in
  // "highway" — words slide horizontally across the stage like passing cars
  const TRANSITION_KEY = "speading:transition";
  const VALID_MODES = ["flash", "fade", "highway"];
  let transitionMode = localStorage.getItem(TRANSITION_KEY);
  if (!VALID_MODES.includes(transitionMode)) transitionMode = "fade";
  // ---- Highway style (cars vs continuous sentence ribbon) ----
  const HIGHWAY_STYLE_KEY = "speading:highwayStyle";
  const VALID_HW_STYLES = ["sentence", "cars"];
  let highwayStyle = localStorage.getItem(HIGHWAY_STYLE_KEY);
  if (!VALID_HW_STYLES.includes(highwayStyle)) highwayStyle = "sentence";
  function isRibbon() { return transitionMode === "highway" && highwayStyle === "sentence"; }

  function applyTransitionMode() {
    document.body.classList.remove("mode-flash", "mode-fade", "mode-highway");
    document.body.classList.remove("style-sentence", "style-cars");
    document.body.classList.add("mode-" + transitionMode);
    document.body.classList.add("style-" + highwayStyle);
    document.querySelectorAll("#modePicker .mode-btn").forEach((b) => {
      b.setAttribute("aria-pressed", b.dataset.mode === transitionMode ? "true" : "false");
    });
    document.querySelectorAll("#highwayStyle .hw-btn").forEach((b) => {
      b.setAttribute("aria-pressed", b.dataset.style === highwayStyle ? "true" : "false");
    });
  }
  function setTransitionMode(m) {
    if (!VALID_MODES.includes(m)) return;
    const wasPlaying = playing;
    if (wasPlaying) pause();
    transitionMode = m;
    try { localStorage.setItem(TRANSITION_KEY, m); } catch {}
    applyTransitionMode();
    destroyRibbon();
    while (highwayLane.firstChild) highwayLane.removeChild(highwayLane.firstChild);
    if (words.length) showWord();
    if (wasPlaying) play();
  }
  function setHighwayStyle(s) {
    if (!VALID_HW_STYLES.includes(s)) return;
    const wasPlaying = playing;
    if (wasPlaying) pause();
    highwayStyle = s;
    try { localStorage.setItem(HIGHWAY_STYLE_KEY, s); } catch {}
    applyTransitionMode();
    destroyRibbon();
    while (highwayLane.firstChild) highwayLane.removeChild(highwayLane.firstChild);
    if (words.length && transitionMode === "highway") showWord();
    if (wasPlaying) play();
  }

  // ---- Highway · Cars: spawn one word that slides off-right to off-left ----
  function spawnHighwayWord(w) {
    const span = document.createElement("span");
    span.className = "highway-word";
    renderFocal(w, span);
    const dur = Math.max(220, intervalMs() * 1.6);
    span.style.animationDuration = dur + "ms";
    highwayLane.appendChild(span);
    setTimeout(() => { if (span.parentNode) span.remove(); }, dur + 80);
  }

  // ---- Highway · Sentence: continuous ribbon at constant px/sec ----
  //
  // Hot-path discipline: NO getBoundingClientRect() per frame.
  // We track every visible span's right-edge offset in JS (cumulative width
  // since the ribbon's left origin) and a single `offsetPx` scrolls them
  // collectively via translate3d. Center detection is a binary-ish walk over
  // those cached offsets — never a layout read.
  //
  // Buffer policy: 8 viewports of pre-rendered words to the right, capped at
  // RIBBON_MAX_SPANS. Spans are cheap; iOS Safari throttling during URL-bar
  // transitions or low-power can drop us to 30Hz briefly, and the ribbon must
  // not run dry. Pruning is loose (4 viewports of margin on the left) so a
  // brief drag-back doesn't expose a gap.
  const RIBBON_HEADROOM_VW = 8;        // viewports of words to keep rendered to the right
  const RIBBON_LEFT_MARGIN_VW = 4;     // viewports of trailing words to keep before pruning
  const RIBBON_MAX_SPANS = 50000;      // hard cap; spans are cheap but DOM isn't infinite

  let hw = null;
  function ribbonPxPerSec() {
    // ~0.24 vw per WPM at 300 WPM looks roughly right; scale with viewport.
    const wpm = parseInt(wpmEl.value, 10) || 300;
    return Math.max(80, wpm * (window.innerWidth / 420));
  }
  function ensureRibbon() {
    if (hw) return;
    const ribbon = document.createElement("div");
    ribbon.className = "highway-ribbon";
    highwayLane.innerHTML = "";
    highwayLane.appendChild(ribbon);
    hw = {
      ribbon,
      leftIdx: idx,        // word index of ribbon.firstChild (when populated)
      rightIdx: idx - 1,   // word index of ribbon.lastChild
      // Cached cumulative right-edge offsets, parallel to ribbon.children.
      // rights[i] = sum of widths of children[0..i] including margin-right.
      // The left edge of children[i] is rights[i-1] (or 0 for i=0).
      rights: [],
      offsetPx: 0,         // how many px the ribbon has scrolled to the left
      startX: 0,           // additional translate to put leftIdx's center at the screen center
      lastTime: performance.now(),
      raf: null,
      // Margin between words in px, sampled on first append.
      gapPx: 0,
    };
    hwFill();
    hwCenterIdx(idx, /*preserveOffset*/ false);
    hw.raf = requestAnimationFrame(hwFrame);
  }
  function destroyRibbon() {
    if (!hw) return;
    if (hw.raf) cancelAnimationFrame(hw.raf);
    if (hw.ribbon && hw.ribbon.parentNode) hw.ribbon.parentNode.removeChild(hw.ribbon);
    hw = null;
  }
  function hwApply() {
    if (!hw) return;
    // translate3d keeps the ribbon on its own GPU layer.
    hw.ribbon.style.transform =
      "translate3d(" + (hw.startX - hw.offsetPx).toFixed(2) + "px, -50%, 0)";
  }
  function hwAppend(i) {
    // Append a word span for index i and record its cumulative right edge.
    // ONE offsetWidth read here (forced layout) — but only on append, never
    // per frame. With an 8-viewport buffer the append rate during steady-state
    // playback is at most ~one per word interval, not per frame.
    const span = document.createElement("span");
    span.className = "hw-w";
    renderFocal(words[i], span);
    span.dataset.i = i;
    hw.ribbon.appendChild(span);
    const w = span.offsetWidth;
    // Sample the inter-word gap once. CSS sets `margin-right: 0.45em` on .hw-w;
    // resolved as px depends on font-size which depends on --word-scale, so we
    // read it once here and refresh on scale change via hwResetWidths().
    if (hw.rights.length === 0) {
      const cs = getComputedStyle(span);
      const m = parseFloat(cs.marginRight);
      hw.gapPx = Number.isFinite(m) ? m : 0;
    }
    const prev = hw.rights.length ? hw.rights[hw.rights.length - 1] : 0;
    hw.rights.push(prev + w + hw.gapPx);
    hw.rightIdx = i;
  }
  function hwResetWidths() {
    // Recompute the cached widths of all currently-visible spans. Used on
    // resize / scale change. Costs N offsetWidth reads (one forced layout)
    // but only at user-driven event boundaries — not on the hot path.
    if (!hw || !hw.ribbon.children.length) return;
    const kids = hw.ribbon.children;
    let acc = 0;
    let gap = 0;
    if (kids.length) {
      const cs = getComputedStyle(kids[0]);
      const m = parseFloat(cs.marginRight);
      gap = Number.isFinite(m) ? m : 0;
    }
    hw.gapPx = gap;
    const next = new Array(kids.length);
    for (let k = 0; k < kids.length; k++) {
      acc += kids[k].offsetWidth + gap;
      next[k] = acc;
    }
    hw.rights = next;
  }
  function hwFill() {
    if (!hw) return;
    const headroom = window.innerWidth * RIBBON_HEADROOM_VW;
    // Right edge of the last span in screen coordinates (accounting for
    // ribbon transform). leftEdgeScreen = startX - offsetPx.
    const lastRight = hw.rights.length ? hw.rights[hw.rights.length - 1] : 0;
    let visualRight = (hw.startX - hw.offsetPx) + lastRight;
    while (
      hw.rightIdx + 1 < words.length &&
      hw.ribbon.children.length < RIBBON_MAX_SPANS &&
      visualRight < window.innerWidth + headroom
    ) {
      hwAppend(hw.rightIdx + 1);
      visualRight = (hw.startX - hw.offsetPx) + hw.rights[hw.rights.length - 1];
    }
  }
  function hwPrune() {
    if (!hw) return;
    const margin = window.innerWidth * RIBBON_LEFT_MARGIN_VW;
    // Right edge of the first span in screen coordinates:
    //   firstRight = (startX - offsetPx) + rights[0]
    while (hw.ribbon.children.length > 1 && hw.rights.length > 1) {
      const firstRight = (hw.startX - hw.offsetPx) + hw.rights[0];
      if (firstRight >= -margin) break;
      // Drop the first child. Removing it shifts every other child's
      // offsetLeft left by `consumed` (the first child's width including its
      // gap) — but our `rights` array is RELATIVE to the ribbon's left edge,
      // not the children's offsetLeft, so we re-base it: subtract rights[0]
      // from every entry and shift the array down. We also subtract `consumed`
      // from offsetPx so the visual position holds (startX - offsetPx + new
      // rights[k] === old startX - old offsetPx + old rights[k]).
      const consumed = hw.rights[0];
      hw.ribbon.removeChild(hw.ribbon.firstChild);
      hw.rights.shift();
      for (let k = 0; k < hw.rights.length; k++) hw.rights[k] -= consumed;
      hw.offsetPx -= consumed;
      hw.leftIdx++;
    }
  }
  function hwSyncIdx() {
    if (!hw || !hw.rights.length) return;
    // Find the span whose left/right edges straddle the screen center.
    // Center is at (cx) in screen space; in ribbon space it's:
    //   targetX = cx - (startX - offsetPx) = cx - startX + offsetPx
    // Then binary-search hw.rights for the first entry > targetX.
    const cx = window.innerWidth / 2;
    const targetX = cx - hw.startX + hw.offsetPx;
    const arr = hw.rights;
    let lo = 0, hi = arr.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid] <= targetX) lo = mid + 1; else hi = mid;
    }
    const wIdx = hw.leftIdx + lo;
    if (Number.isFinite(wIdx) && wIdx !== idx) {
      idx = wIdx;
      bar.style.width = (idx / Math.max(1, words.length - 1) * 100).toFixed(2) + "%";
      statusEl.textContent =
        (idx + 1).toLocaleString() + " / " + words.length.toLocaleString() +
        "  ·  " + (pageOf(idx) + 1) + " of " + pageCount();
      saveProgress();
    }
  }
  function hwCenterIdx(targetIdx, preserveOffset) {
    if (!hw) return;
    if (targetIdx < hw.leftIdx || targetIdx > hw.rightIdx) {
      // Out of buffer: hard reset. startX gets recomputed below.
      hw.ribbon.innerHTML = "";
      hw.rights = [];
      hw.leftIdx = targetIdx;
      hw.rightIdx = targetIdx - 1;
      if (!preserveOffset) hw.offsetPx = 0;
      hw.startX = 0;
      hwFill();
    } else if (!preserveOffset) {
      hw.offsetPx = 0;
    }
    // Compute the center of children[targetIdx - leftIdx] from cached widths.
    const k = targetIdx - hw.leftIdx;
    if (k < 0 || k >= hw.rights.length) return;
    const left = k === 0 ? 0 : hw.rights[k - 1];
    const right = hw.rights[k] - hw.gapPx; // exclude trailing gap from "this word"
    const center = (left + right) / 2;
    const targetCenter = window.innerWidth / 2;
    hw.startX = targetCenter - center + hw.offsetPx;
    hwApply();
  }
  // External scrub: shift the ribbon by N pixels (positive = forward).
  // Refills/prunes and resyncs idx.
  function hwScrubBy(deltaPx) {
    if (!hw) return;
    hw.offsetPx += deltaPx;
    if (hw.offsetPx < -window.innerWidth * 2) hw.offsetPx = -window.innerWidth * 2;
    hwFill();
    hwPrune();
    hwApply();
    hwSyncIdx();
  }
  function hwFrame(t) {
    if (!hw) return;
    const dt = Math.min(0.1, (t - hw.lastTime) / 1000);
    hw.lastTime = t;
    if (playing && words.length) {
      hw.offsetPx += dt * ribbonPxPerSec();
      hwFill();
      hwPrune();
      hwApply();
      hwSyncIdx();
      if (idx >= words.length - 1) pause();
    } else if (ribbonInertia) {
      // Inertial drag-scrub continues here.
      const v = ribbonInertia.vx * Math.pow(0.94, dt * 60);
      hw.offsetPx += v * dt;
      ribbonInertia.vx = v;
      hwFill();
      hwPrune();
      hwApply();
      hwSyncIdx();
      if (Math.abs(v) < 12) ribbonInertia = null;
    }
    if (hw) hw.raf = requestAnimationFrame(hwFrame);
  }
  let ribbonInertia = null;

  function showWord() {
    const w = words[idx];
    if (!w) return;
    if (isRibbon()) {
      ensureRibbon();
      hwCenterIdx(idx, /*preserveOffset*/ true);
    } else if (transitionMode === "highway") {
      spawnHighwayWord(w);
    } else if (reducedMotion || transitionMode === "flash") {
      renderFocal(w);
    } else { // fade
      wordEl.style.opacity = "0";
      setTimeout(() => {
        renderFocal(w);
        wordEl.style.opacity = "1";
      }, 45);
    }
    bar.style.width = (idx / Math.max(1, words.length - 1) * 100).toFixed(2) + "%";
    statusEl.textContent =
      (idx + 1).toLocaleString() + " / " + words.length.toLocaleString() +
      "  ·  " + (pageOf(idx) + 1) + " of " + pageCount();
    saveProgress();
  }

  function tick() {
    if (!playing) return;
    if (idx >= words.length - 1) { pause(); return; }
    idx++;
    showWord();
    timer = setTimeout(tick, intervalMs());
  }

  function play() {
    if (!words.length) return;
    if (idx >= words.length - 1) idx = 0;
    playing = true;
    document.body.classList.add("reading");
    playBtn.textContent = "Pause";
    if (isRibbon()) {
      ensureRibbon();
      hw.lastTime = performance.now();
      // RAF already running; advances will pick up because playing is now true
    } else {
      timer = setTimeout(tick, intervalMs());
    }
    maybeFullscreen();
  }
  function pause() {
    playing = false;
    document.body.classList.remove("reading");
    playBtn.textContent = "Read";
    if (timer) { clearTimeout(timer); timer = null; }
    // Keep ribbon DOM in place; RAF stays alive but stops accumulating offset
  }
  function toggle() { playing ? pause() : play(); }

  // ---- Persistence ----
  function saveProgress() {
    if (!bookKey) return;
    try {
      localStorage.setItem(bookKey, JSON.stringify({
        idx, total: words.length, name: bookName, t: Date.now()
      }));
    } catch {}
  }
  function loadProgress(key, total) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const v = JSON.parse(raw);
      if (v && v.total === total && typeof v.idx === "number") return v;
    } catch {}
    return null;
  }

  // ---- Overview: a pinch-zoomable filmstrip of pages ----
  //
  // The strip is one absolutely-positioned row of "tile" elements, one per
  // book page. Each tile's width = ovTileW (a function of zoom). The strip
  // is scrolled horizontally via translate3d on a scrubX value (px). Pinch
  // changes ovTileW continuously; tap-to-enter on a tile commits the page
  // and closes the overview. Tiles outside the viewport keep their dimensions
  // but have their inner page content removed (virtualization), so 30,000-
  // page books still scroll smoothly.
  const ovStrip = document.getElementById("ovStrip");
  const ovReticle = document.getElementById("ovReticle");
  const ovZoomCaption = document.getElementById("ovZoomCaption");

  // Zoom: ovTileW (CSS px) is the rendered width of one tile. Min and max
  // cap it; min creates a heatmap of bands, max fills the screen with one
  // page. "Default" puts ~5 tiles in view on a typical desktop.
  const OV_MIN_TILE = 3;       // heatmap-thin
  const OV_MAX_TILE = 720;     // a single near-screen page
  let ovTileW = 240;
  let ovGap = 14;              // px between tiles
  let ovScrubX = 0;            // px the strip has shifted left (positive = scrolled right)
  let ovInertia = null;        // { vx } px/s
  let ovRaf = null;
  // How many tiles around the visible window we keep "populated" with text.
  function ovPopulateWindow() {
    // At very small tile sizes, populating the page text is wasted cycles.
    if (ovTileW < 80) return 0;
    return Math.max(2, Math.ceil(window.innerWidth / ovTileW) + 4);
  }

  function ovTileFullW() { return ovTileW + ovGap; }

  function openOverview() {
    if (!words.length) return;
    pause();
    overview.classList.add("visible");
    overview.setAttribute("aria-hidden", "false");
    // Frame later for transition to fire.
    requestAnimationFrame(() => overview.classList.add("open"));
    // Default zoom: aim for "a row of pages" — ~6 visible across.
    const target = Math.max(120, Math.min(380, window.innerWidth / 6));
    ovTileW = target;
    ovBuildStrip();
    ovResetMarks();
    ovApplyZoom();
    ovCenterOnPage(pageOf(idx), /*animate*/ false);
    if (!ovRaf) ovRaf = requestAnimationFrame(ovFrame);
    currentOverviewPage = pageOf(idx);
    ovPage.value = currentOverviewPage + 1;
    ovPageNum.value = currentOverviewPage + 1;
  }
  function closeOverview() {
    overview.classList.remove("open");
    overview.setAttribute("aria-hidden", "true");
    setTimeout(() => {
      overview.classList.remove("visible");
      if (ovRaf) { cancelAnimationFrame(ovRaf); ovRaf = null; }
      ovInertia = null;
      document.body.classList.remove("ov-thumb", "ov-heat", "scrubbing");
    }, 460);
  }

  function ovBuildStrip() {
    const N = pageCount();
    // (Re)create tiles only when the count changes.
    if (ovStrip.childElementCount !== N) {
      const frag = document.createDocumentFragment();
      for (let p = 0; p < N; p++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.p = p;
        const folio = document.createElement("div");
        folio.className = "folio";
        folio.textContent = (p + 1).toString();
        tile.appendChild(folio);
        frag.appendChild(tile);
      }
      ovStrip.innerHTML = "";
      ovStrip.appendChild(frag);
      ovLastCurrent = -1;
      ovLastReadHi = -1;
      ovPopulatedRange = { lo: -1, hi: -2 };
      ovResetMarks();
    }
    ovTotal.textContent = N;
    ovPage.max = N;
    ovPageNum.max = N;
    ovTitle.textContent = bookName || "—";
  }
  function ovApplyZoom() {
    // Layout via CSS variables — pinch updates 3 properties, not 30k.
    const N = ovStrip.childElementCount;
    ovGap = ovTileW < 40 ? 1 : ovTileW < 100 ? 4 : 14;
    const tileFull = ovTileFullW();
    const aspect = 1.4;
    const maxTileH = Math.max(120, window.innerHeight - 200);
    const tileH = ovTileW < 24
      ? maxTileH
      : ovTileW < 80
        ? Math.min(maxTileH, ovTileW * 5)
        : Math.min(maxTileH, ovTileW * aspect);
    ovStrip.style.width = (N * tileFull - ovGap) + "px";
    const root = document.documentElement.style;
    root.setProperty("--ov-tile-w", ovTileW + "px");
    root.setProperty("--ov-tile-h", tileH + "px");
    root.setProperty("--ov-gap", ovGap + "px");
    const heatMode = ovTileW < 24;
    const thumbMode = ovTileW < 80;
    document.body.classList.toggle("ov-heat", heatMode);
    document.body.classList.toggle("ov-thumb", thumbMode);
    ovRepopulateVisible();
    ovApplyTransform();
    ovZoomCaption.textContent = heatMode
      ? "  · heatmap"
      : thumbMode
        ? "  · " + Math.round(window.innerWidth / tileFull) + " pages across"
        : "  · " + (ovTileW / 100).toFixed(1) + "× tile";
  }

  let ovLastCurrent = -1;     // last "current" tile index (idx-derived)
  let ovLastReadHi = -1;      // last "read up to (exclusive)" tile index (currentOverviewPage)
  function ovUpdateMarks() {
    // Incremental: only diff the small number of tiles whose state changed.
    // That's the just-vacated current, the new current, and the slice between
    // the old and new "read up to" boundary.
    const N = ovStrip.childElementCount;
    const curPage = pageOf(idx);                // book progress
    const readHi = currentOverviewPage;         // what the user is *looking at*
    if (curPage !== ovLastCurrent) {
      if (ovLastCurrent >= 0 && ovLastCurrent < N) {
        ovStrip.children[ovLastCurrent].classList.remove("current");
      }
      if (curPage >= 0 && curPage < N) {
        ovStrip.children[curPage].classList.add("current");
      }
      ovLastCurrent = curPage;
    }
    if (readHi !== ovLastReadHi) {
      if (readHi > ovLastReadHi) {
        for (let p = Math.max(0, ovLastReadHi); p < readHi && p < N; p++) {
          if (p < curPage) ovStrip.children[p].classList.add("read");
        }
      } else {
        for (let p = readHi; p < ovLastReadHi && p < N; p++) {
          ovStrip.children[p].classList.remove("read");
        }
      }
      ovLastReadHi = readHi;
    }
  }
  function ovResetMarks() {
    // Full pass: used on book load or after rebuild.
    const N = ovStrip.childElementCount;
    const curPage = pageOf(idx);
    for (let p = 0; p < N; p++) {
      const tile = ovStrip.children[p];
      const wantCur = p === curPage;
      const wantRead = p < curPage;
      if (wantCur !== tile.classList.contains("current")) tile.classList.toggle("current", wantCur);
      if (wantRead !== tile.classList.contains("read")) tile.classList.toggle("read", wantRead);
    }
    ovLastCurrent = curPage;
    ovLastReadHi = curPage;
  }

  function ovApplyTransform() {
    // Center the strip's reticle (which is fixed at viewport-center) on the
    // playhead position. The strip transforms left by ovScrubX, so the
    // viewport center maps to ovScrubX in strip coords.
    ovStrip.style.transform = "translate3d(" + (-ovScrubX).toFixed(2) + "px, 0, 0)";
  }

  function ovCenterOnPage(p, animate) {
    const tileFull = ovTileFullW();
    const target = p * tileFull + ovTileW / 2 - window.innerWidth / 2 + ovBodyLeft();
    if (animate) {
      ovAnimateScrubTo(target, 460);

  // ---- Word scale (continuous float) ----

  // interaction never rounds.
  const SCALE_KEY = "speading:scale";
  const SCALE_MIN = 50, SCALE_MAX = 220;

  const scaleLabel = document.getElementById("scaleLabel");

  function queueRibbonResync() {
    // RAF-throttle the (expensive) ribbon width resample during continuous

    if (scaleResyncQueued) return;
    scaleResyncQueued = true;
    requestAnimationFrame(() => {
      scaleResyncQueued = false;

    const prevBody = body.style.overflow;
    const prevMin = body.style.minHeight;
    html.style.overflow = "auto";
    body.style.overflow = "auto";
    body.style.minHeight = "calc(100dvh + 80px)";

    requestAnimationFrame(() => requestAnimationFrame(() => {
      window.scrollTo(0, 80);

    if (e.target.closest("#controls, #folio, #toast")) return;
    if (e.ctrlKey || e.metaKey) {
      // Zoom. deltaY positive = pinch out (smaller); negative = pinch in (larger).
      // exp() makes zoom feel multiplicative — equal distances feel like equal ratio.
      e.preventDefault();
      const factor = Math.exp(-e.deltaY * 0.01);
      applyScale(scalePct * factor);
      // Persist when the user pauses scrolling (debounced).
      if (zoomPersistTimer) clearTimeout(zoomPersistTimer);
      zoomPersistTimer = setTimeout(() => { persistScale(); zoomPersistTimer = null; }, 220);
      return;
    }
    if (!words.length) return;
    e.preventDefault();
    // Most wheels report deltaMode 0 (pixel) on trackpads. We translate
    // pixels→words proportional to viewport, with line/page deltas scaled too.
    let dy = e.deltaY;
    let dx = e.deltaX;
    if (e.deltaMode === 1) { dy *= 16; dx *= 16; }       // line
    else if (e.deltaMode === 2) { dy *= window.innerHeight; dx *= window.innerWidth; }
    // Use whichever axis dominates so trackpad horizontal flicks work too.
    const d = Math.abs(dx) > Math.abs(dy) ? dx : dy;
    if (isRibbon() && hw) {
      // 1 wheel notch (~100px) ≈ 0.5 viewports of ribbon — gentle.
      hwScrubBy(d * 0.5);
    } else {
      // Non-ribbon: integer-step the word index. Calibrated so a single
      // notch nudges by ~3 words and a hard scroll moves dozens.
      wheelAccum += d / 30;
      const step = Math.trunc(wheelAccum);
      if (step !== 0) {
        wheelAccum -= step;
        idx = Math.max(0, Math.min(words.length - 1, idx + step));
        showWord();
      }
    }
  }, { passive: false });
  let wheelAccum = 0;
  let zoomPersistTimer = null;

  // ---- Tokenize / load ----
  function tokenize(text) {
    return text
      .replace(/\r/g, "")
      .replace(/[­]/g, "")
      .replace(/-\n/g, "")
      .replace(/\s+/g, " ")
      .trim()
      .split(" ")
      .filter(Boolean);
  }

  function setError(msg) {
    errEl.textContent = msg;
    errEl.style.display = "block";
    setTimeout(() => { errEl.style.display = "none"; }, 6000);
  }

  function loadText(text, file) {
    const toks = tokenize(text);
    if (!toks.length) { setError("No readable text found in " + file.name); return; }
    words = toks;
    bookName = file.name;
    bookKey = STORAGE_PREFIX + file.name + ":" + file.size;
    const prior = loadProgress(bookKey, words.length);
    idx = prior ? prior.idx : 0;
    document.body.classList.remove("empty", "loading");
    playBtn.disabled = false;
    browseBtn.disabled = false;
    back10Btn.disabled = false;
    fwd10Btn.disabled = false;
    back10pBtn.disabled = false;
    fwd10pBtn.disabled = false;
    showWord();
    if (prior) toast("Resumed at word " + (idx + 1).toLocaleString() + " of " + words.length.toLocaleString());
    else toast("Loaded " + words.length.toLocaleString() + " words");
  }

  // ---- Parsers ----
  async function readPdf(buffer) {
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let out = "";
    for (let p = 1; p <= pdf.numPages; p++) {
      wordEl.textContent = "reading pdf · " + p + " of " + pdf.numPages;
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      let last = null;
      for (const item of tc.items) {
        if (last && last.transform && item.transform && last.transform[5] !== item.transform[5]) {
          out += "\n";
        }
        out += item.str;
        if (item.hasEOL) out += "\n"; else out += " ";
        last = item;
      }
      out += "\n";
    }
    return out;
  }

  async function readEpub(buffer) {
    const zip = await JSZip.loadAsync(buffer);
    const containerFile = zip.file("META-INF/container.xml");
    if (!containerFile) throw new Error("Not a valid EPUB (missing container.xml)");
    const containerXml = await containerFile.async("string");
    const opfPath = (containerXml.match(/full-path="([^"]+)"/) || [])[1];
    if (!opfPath) throw new Error("EPUB has no OPF");
    const opfDir = opfPath.includes("/") ? opfPath.replace(/\/[^/]*$/, "/") : "";
    const opf = await zip.file(opfPath).async("string");
    const parser = new DOMParser();
    const opfDoc = parser.parseFromString(opf, "application/xml");

    const manifest = {};
    opfDoc.querySelectorAll("manifest > item").forEach((it) => {
      manifest[it.getAttribute("id")] = it.getAttribute("href");
    });
    const spineIds = [...opfDoc.querySelectorAll("spine > itemref")].map(
      (i) => i.getAttribute("idref")
    );

    let out = "";
    for (let i = 0; i < spineIds.length; i++) {
      wordEl.textContent = "reading epub · " + (i + 1) + " of " + spineIds.length;
      const href = manifest[spineIds[i]];
      if (!href) continue;
      const path = decodeURIComponent(opfDir + href);
      const f = zip.file(path);
      if (!f) continue;
      const html = await f.async("string");
      const doc = parser.parseFromString(html, "text/html");
      doc.querySelectorAll("script,style,nav").forEach((n) => n.remove());
      out += (doc.body ? doc.body.textContent : doc.documentElement.textContent) + "\n\n";
    }
    return out;
  }

  function palmDocDecompress(input) {
    const out = [];
    let i = 0;
    while (i < input.length) {
      const b = input[i++];
      if (b === 0) out.push(0);
      else if (b <= 8) { for (let k = 0; k < b && i < input.length; k++) out.push(input[i++]); }
      else if (b <= 0x7f) out.push(b);
      else if (b <= 0xbf) {
        if (i >= input.length) break;
        const b2 = input[i++];
        const word = (b << 8) | b2;
        const distance = (word >> 3) & 0x07ff;
        const length = (word & 0x0007) + 3;
        const start = out.length - distance;
        if (start < 0) break;
        for (let k = 0; k < length; k++) out.push(out[start + k]);
      } else {
        out.push(0x20); out.push(b ^ 0x80);
      }
    }
    return new Uint8Array(out);
  }

  async function readMobi(buffer) {
    const data = new Uint8Array(buffer);
    const dv = new DataView(buffer);
    if (data.length < 78) throw new Error("Not a MOBI file");
    const numRecords = dv.getUint16(76, false);
    const recOffsets = [];
    for (let r = 0; r < numRecords; r++) {
      recOffsets.push(dv.getUint32(78 + r * 8, false));
    }
    recOffsets.push(data.length);

    const rec0 = data.subarray(recOffsets[0], recOffsets[1]);
    const compression = (rec0[0] << 8) | rec0[1];
    const textRecordCount = (rec0[8] << 8) | rec0[9];

    if (compression === 17480) {
      throw new Error("This MOBI uses HUFF/CDIC compression which isn't supported in-browser. Convert to EPUB (e.g. with Calibre) and try again.");
    }
    if (compression !== 1 && compression !== 2) {
      throw new Error("Unknown MOBI compression (" + compression + ")");
    }

    let raw = new Uint8Array(0);
    for (let r = 1; r <= textRecordCount && r < recOffsets.length - 1; r++) {
      wordEl.textContent = "reading mobi · " + r + " of " + textRecordCount;
      let chunk = data.subarray(recOffsets[r], recOffsets[r + 1]);
      if (compression === 2) chunk = palmDocDecompress(chunk);
      const merged = new Uint8Array(raw.length + chunk.length);
      merged.set(raw); merged.set(chunk, raw.length);
      raw = merged;
    }

    let text;
    try { text = new TextDecoder("utf-8", { fatal: false }).decode(raw); }
    catch { text = new TextDecoder("latin1").decode(raw); }

    const doc = new DOMParser().parseFromString(text, "text/html");
    doc.querySelectorAll("script,style").forEach((n) => n.remove());
    return doc.body ? doc.body.textContent : text;
  }

  async function handleFile(file) {
    pause();
    closeOverview();
    playBtn.disabled = true;
    browseBtn.disabled = true;
    back10Btn.disabled = true;
    fwd10Btn.disabled = true;
    back10pBtn.disabled = true;
    fwd10pBtn.disabled = true;
    document.body.classList.remove("empty");
    document.body.classList.add("loading");
    wordEl.textContent = "opening " + file.name;
    try {
      const buf = await file.arrayBuffer();
      const name = file.name.toLowerCase();
      let text;
      if (name.endsWith(".pdf")) text = await readPdf(buf);
      else if (name.endsWith(".epub")) text = await readEpub(buf);
      else if (name.endsWith(".mobi") || name.endsWith(".azw") || name.endsWith(".azw3")) text = await readMobi(buf);
      else throw new Error("Unsupported file type. Use .pdf, .epub, or .mobi.");
      loadText(text, file);
    } catch (e) {
      console.error(e);
      document.body.classList.remove("loading");
      document.body.classList.add("empty");
      wordEl.innerHTML = "A quiet place to read at speed.<br>Open a book to begin.";
      setError(e.message || String(e));
    }
  }

  fileInput.addEventListener("change", (e) => {
    if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  });

  ["dragenter", "dragover"].forEach((evt) =>
    window.addEventListener(evt, (e) => {
      e.preventDefault(); drop.classList.add("active");
    })
  );
  ["dragleave", "drop"].forEach((evt) =>
    window.addEventListener(evt, (e) => {
      if (evt === "dragleave" && e.target !== drop) return;
      drop.classList.remove("active");
    })
  );
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("active");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
</script>
</body>
</html>
